- include_role:
    name: alpha-deploy-lib/resolve-params
  vars:
    stacks:
    - type: 'BASE'
      name: 'base'
    - type: 'CORE'
      name: 'base'

- set_fact:
    files: "{{ role_path }}/files"

- include_role:
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/hosts.yaml'
    type: DNS
  when: '"AliasDomainName" in params'

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'
  when: '"AliasDomainName" in params'

- include_role:
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/cert.yaml'
    type: GLOBAL
    settings:
      Region: 'us-east-1'
  when: '"AliasDomainName" in params'

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'
  when: '"AliasDomainName" in params'

- name: 'Verify GlobalCertificateArn covers WildcardSubdomainName'
  when: '"WildcardSubdomainName" in params and params["WildcardSubdomainName"] | length > 0'
  shell: |
    import json, sys, boto3
    from botocore.exceptions import ClientError

    REGION = "us-east-1"
    CERT_ARN = "{{ params['GlobalCertificateArn'] }}"
    REQUIRED = "*.{{ params['WildcardSubdomainName'] }}.{{ params['PublicHostedZoneName'] }}"

    acm = boto3.client("acm", region_name=REGION)
    try:
        cert = acm.describe_certificate(CertificateArn=CERT_ARN)["Certificate"]
    except ClientError as e:
        print(json.dumps({"ok": False, "error": "describe_certificate failed: %s" % e}))
        sys.exit(0)

    sans = set(cert.get("SubjectAlternativeNames", []))
    if cert.get("DomainName"):
        sans.add(cert["DomainName"])

    print(json.dumps({
        "ok": REQUIRED in sans,
        "required": REQUIRED,
        "sans": sorted(sans),
    }))
  args:
    executable: /usr/bin/python3
  register: _wildcard_cert_check

- name: 'Fail if GlobalCertificateArn does not cover the wildcard subdomain'
  when: '"WildcardSubdomainName" in params and params["WildcardSubdomainName"] | length > 0'
  vars:
    _check: '{{ _wildcard_cert_check.stdout | from_json }}'
  fail:
    msg: |
      GlobalCertificateArn does not cover required SAN '{{ _check.required }}'.
      Add it to the global/base certificate before deploying with WildcardSubdomainName.
      Current SANs: {{ _check.sans | default([]) }}
      {{ ('Error: ' + _check.error) if _check.error is defined else '' }}
  failed_when: not (_check.ok | default(false))

- include_role: 
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/web.yml'
    type: WEB

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'

- name: 'Read commit id baked into the build image'
  shell: 'cat /dist/commit-id 2>/dev/null || echo unknown'
  register: commit_id_result

- set_fact:
    web_config:
      BuildId: '{{ params["BuildId"] }}'
      CommitId: '{{ commit_id_result.stdout | trim }}'
      DeployTime: '{{ lookup("pipe", "date -u +%Y-%m-%dT%H:%M:%SZ") }}'
      ResourceName: '{{ params["ResourceName"] }}'
      EnvironmentNameLower: '{{ params["EnvironmentNameLower"] }}'
      EnvironmentNameUpper: '{{ params["EnvironmentNameUpper"] }}'
      AuthUserPoolDomain: '{{ params["AuthUserPoolDomain"] }}'
      AuthUserPoolId: '{{ params["AuthUserPoolId"] }}'
      AuthUserPoolClientId: '{{ params["WebUserPoolClientId"] }}'
      PublicHostedZoneName: '{{ params["PublicHostedZoneName"] }}'
      HostedZoneName: '{{ params["PublicHostedZoneName"] }}'
      ApplicationServiceName: '{{ params["ApplicationServiceName"] | default("user-svc") }}'
      Region: '{{ params["Region"] }}'

- name: 'Copy index.html to template'
  shell: |
    env='{{ params["EnvironmentNameLower"] }}'
    mkdir -p /dist/$env/s3 
    cp -r /dist/s3/* /dist/$env/s3 
    rm -rf /dist/index.j2.html
    cp /dist/$env/s3/index.html /dist/index.j2.html

- name: 'Render index.html template'
  template:
    src: /dist/index.j2.html
    dest: '/dist/{{ params["EnvironmentNameLower"] }}/s3/index.html'

- name: 'Write config.json for client version polling'
  copy:
    content: '{{ web_config | to_json }}'
    dest: '/dist/{{ params["EnvironmentNameLower"] }}/s3/config.json'

- name: 'Copy s3 content to bucket'
  environment: '{{ params }}'
  s3_sync:
    region: '{{ params["Region"] }}'
    bucket: '{{ params["S3BucketName"] }}'
    file_root: '/dist/{{ params["EnvironmentNameLower"] }}/s3'
    file_change_strategy: force
    delete: true
    mime_map:
      .js: application/javascript
      .json: application/json
      .css: text/css
      .html: text/html
      .svg: image/svg+xml
      .svgz: image/svg+xml
      .ico: image/x-icon

- name: 'InvalidateCache'
  retries: 3
  delay: 30
  cloudfront_invalidation:
    distribution_id: '{{ params["CloudFrontDistributionId"] }}'
    caller_reference: '{{ params["ResourceName"] }}-{{ params["BuildId"] }}'
    target_paths:
      - "/*"
