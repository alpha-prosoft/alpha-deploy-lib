- include_role:
    name: alpha-deploy-lib/resolve-params
  vars:
    stacks:
    - type: 'BASE'
      name: 'base'
    - type: 'CORE'
      name: 'base'

- set_fact:
    params: '{{ params | combine(auth_params) }}'
  when: auth_params is defined

- set_fact:
    files: "{{ role_path }}/files"

- include_role:
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/hosts.yaml'
    type: DNS
  when: '"AliasDomainName" in params'

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'
  when: '"AliasDomainName" in params'

- include_role:
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/cert.yaml'
    type: GLOBAL
    settings:
      Region: 'us-east-1'
  when: '"AliasDomainName" in params'

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'
  when: '"AliasDomainName" in params'

- name: 'Verify GlobalCertificateArn covers WildcardSubdomainName'
  when: '"WildcardSubdomainName" in params and params["WildcardSubdomainName"] | length > 0'
  shell: |
    import json, sys, boto3
    from botocore.exceptions import ClientError

    REGION = "us-east-1"
    CERT_ARN = "{{ params['GlobalCertificateArn'] }}"
    REQUIRED = "*.{{ params['WildcardSubdomainName'] }}.{{ params['PublicHostedZoneName'] }}"

    acm = boto3.client("acm", region_name=REGION)
    try:
        cert = acm.describe_certificate(CertificateArn=CERT_ARN)["Certificate"]
    except ClientError as e:
        print(json.dumps({"ok": False, "error": "describe_certificate failed: %s" % e}))
        sys.exit(0)

    sans = set(cert.get("SubjectAlternativeNames", []))
    if cert.get("DomainName"):
        sans.add(cert["DomainName"])

    print(json.dumps({
        "ok": REQUIRED in sans,
        "required": REQUIRED,
        "sans": sorted(sans),
    }))
  args:
    executable: /usr/bin/python3
  register: _wildcard_cert_check

- name: 'Fail if GlobalCertificateArn does not cover the wildcard subdomain'
  when: '"WildcardSubdomainName" in params and params["WildcardSubdomainName"] | length > 0'
  vars:
    _check: '{{ _wildcard_cert_check.stdout | from_json }}'
  fail:
    msg: |
      GlobalCertificateArn does not cover required SAN '{{ _check.required }}'.
      Add it to the global/base certificate before deploying with WildcardSubdomainName.
      Current SANs: {{ _check.sans | default([]) }}
      {{ ('Error: ' + _check.error) if _check.error is defined else '' }}
  failed_when: not (_check.ok | default(false))

- set_fact:
    api_enabled: '{{ (settings | default({})).get("EnableApi", false) | bool }}'

- include_role:
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/api.yaml'
    type: API
  when: api_enabled

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'
  when: api_enabled

- include_role: 
    name: alpha-deploy-lib/deploy-cloudformation
  vars:
    cloud_formation: '{{ files }}/web.yml'
    type: WEB

- set_fact:
    params: '{{ params | combine( cloud_formation_output["stack_outputs"] ) }}'

- set_fact:
    application_ensured: '{{ (settings | default({})).get("EnsureApplication", false) | bool }}'

- name: 'Ensure the application of the web site exists'
  when: application_ensured
  shell: |
    import json, uuid, boto3

    SETTINGS = json.loads(r"""{{ settings | default({}) | to_json }}""")
    NAME = SETTINGS.get("ApplicationName") or "{{ params['ResourceName'] }}"
    FUNCTION = "{{ params['EnvironmentNameUpper'] }}-{{ params['ApplicationServiceName'] }}:BUILD"

    client = boto3.client("lambda", region_name="{{ params['Region'] }}")

    def call(body):
        request = {"request-id": "#" + str(uuid.uuid4()),
                   "interaction-id": "#" + str(uuid.uuid4()),
                   "meta": {"realm": "prod",
                            "user": {"id": "deployment",
                                     "role": ":non-interactive",
                                     "roles": [":non-interactive"]}}}
        request.update(body)
        response = client.invoke(FunctionName=FUNCTION, Payload=json.dumps(request))
        answer = json.loads(response["Payload"].read().decode("utf-8"))
        if response.get("FunctionError") or "result" not in answer:
            raise Exception("%s answered %s" % (FUNCTION, json.dumps(answer)[:1000]))
        return answer["result"]

    def find():
        return call({"query": {"query-id": ":application->fetch-by-name", "name": NAME}})

    application = find()
    created = application is None
    if created:
        application_id = str(uuid.uuid4())
        attrs = {"name": NAME, "title": SETTINGS.get("ApplicationTitle") or NAME}
        if SETTINGS.get("ApplicationFeatures"):
            attrs["features"] = [":" + feature for feature in SETTINGS["ApplicationFeatures"]]
        call({"commands": [{"cmd-id": ":create-application", "id": "#" + application_id, "attrs": attrs}]})
        if SETTINGS.get("ApplicationOwner"):
            call({"commands": [{"cmd-id": ":add-admin", "id": "#" + application_id,
                                "attrs": {"email": SETTINGS["ApplicationOwner"]}}]})
    else:
        application_id = application["id"].lstrip("#")

    print(json.dumps({"name": NAME, "id": application_id, "created": created}))
  args:
    executable: /usr/bin/python3
  environment: '{{ params }}'
  register: _application

- set_fact:
    application: '{{ _application.stdout_lines | last | from_json }}'
  when: application_ensured

- debug:
    msg: 'Application {{ application.name }} ({{ application.id }}){{ " created" if application.created else " exists" }}'
  when: application_ensured

- name: 'Read commit id baked into the build image'
  shell: 'cat /dist/commit-id 2>/dev/null || echo unknown'
  register: commit_id_result

- set_fact:
    web_config:
      BuildId: '{{ params["BuildId"] }}'
      CommitId: '{{ commit_id_result.stdout | trim }}'
      DeployTime: '{{ lookup("pipe", "date -u +%Y-%m-%dT%H:%M:%SZ") }}'
      ResourceName: '{{ params["ResourceName"] }}'
      EnvironmentNameLower: '{{ params["EnvironmentNameLower"] }}'
      EnvironmentNameUpper: '{{ params["EnvironmentNameUpper"] }}'
      AuthUserPoolDomain: '{{ params["AuthUserPoolDomain"] }}'
      AuthUserPoolId: '{{ params["AuthUserPoolId"] }}'
      AuthUserPoolClientId: '{{ params["WebUserPoolClientId"] }}'
      PublicHostedZoneName: '{{ params["PublicHostedZoneName"] }}'
      HostedZoneName: '{{ params["PublicHostedZoneName"] }}'
      ApplicationServiceName: '{{ params["ApplicationServiceName"] | default("user-svc") }}'
      ApiEnabled: '{{ api_enabled }}'
      Region: '{{ params["Region"] }}'

- set_fact:
    web_config: '{{ web_config | combine({"ApplicationName": application.name, "ApplicationId": application.id}) }}'
  when: application_ensured

- name: 'Copy index.html to template'
  shell: |
    env='{{ params["EnvironmentNameLower"] }}'
    mkdir -p /dist/$env/s3 
    cp -r /dist/s3/* /dist/$env/s3 
    rm -rf /dist/index.j2.html
    cp /dist/$env/s3/index.html /dist/index.j2.html

- name: 'Render index.html template'
  template:
    src: /dist/index.j2.html
    dest: '/dist/{{ params["EnvironmentNameLower"] }}/s3/index.html'

- name: 'Write config.json for client version polling'
  copy:
    content: '{{ web_config | to_json }}'
    dest: '/dist/{{ params["EnvironmentNameLower"] }}/s3/config.json'

- name: 'Gzip text assets and copy s3 content to bucket'
  environment: '{{ params }}'
  shell: |
    set -euo pipefail
    root='/dist/{{ params["EnvironmentNameLower"] }}/s3'
    bucket='s3://{{ params["S3BucketName"] }}'
    region='{{ params["Region"] }}'

    text_types=(
      'js:application/javascript'
      'css:text/css'
      'html:text/html'
      'json:application/json'
      'map:application/json'
      'svg:image/svg+xml'
      'txt:text/plain'
      'webmanifest:application/manifest+json'
    )

    binary_args=()
    for entry in "${text_types[@]}"; do
      ext="${entry%%:*}"
      binary_args+=(--exclude "*.${ext}")
      find "$root" -type f -name "*.${ext}" \
        -exec sh -c 'gzip -9 -n -c "$1" > "$1.gz" && mv "$1.gz" "$1"' _ {} \;
    done

    aws s3 sync "$root" "$bucket" --region "$region" --delete \
      "${binary_args[@]}"

    for entry in "${text_types[@]}"; do
      ext="${entry%%:*}"
      type="${entry#*:}"
      aws s3 sync "$root" "$bucket" --region "$region" --delete \
        --exclude '*' --include "*.${ext}" \
        --content-type "$type" --content-encoding gzip
    done
  args:
    executable: /bin/bash

- name: 'InvalidateCache'
  retries: 3
  delay: 30
  cloudfront_invalidation:
    distribution_id: '{{ params["CloudFrontDistributionId"] }}'
    caller_reference: '{{ params["ResourceName"] }}-{{ params["BuildId"] }}'
    target_paths:
      - "/*"
